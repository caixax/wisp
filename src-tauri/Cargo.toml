[package]
name = "wisp"
version = "0.1.0"
description = "A fast, lightweight, open source launcher for your Epic Games library."
authors = ["caixax"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
# The library target holds all app logic so it can be unit-tested and reused by
# the Linux/Windows binaries alike. `main.rs` is a thin entry point.
# Desktop-only, so no cdylib/staticlib targets (those exist for mobile).
name = "wisp_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
